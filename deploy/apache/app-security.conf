# Seguridad de archivos dentro del docroot.
#
# El .htaccess del proyecto reescribe todo lo que NO existe en disco
# hacia index.php. Los archivos que SI existen se entregan tal cual,
# sin pasar por PHP: por eso .env (con la clave de la base de datos y las
# keys de las IA) queda expuesto si alguien pide /.env.
#
# Estos archivos se niegan siempre, aunque existan en disco.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
