# Rewrite de las rutas internas de la app.
#
# El rewrite tambien vive en el .htaccess del docroot, pero ese archivo
# puede faltar, quedar vacio o ser ignorado (AllowOverride), y sin el
# rewrite TODAS las pantallas internas devuelven 404 de Apache: solo
# funcionan el login y los archivos estaticos, porque esos existen en disco.
#
# Con el rewrite a nivel de servidor, el ruteo deja de depender de que el
# .htaccess este presente y sea leido.
<Directory /var/www/html>
    Options -Indexes -Multiviews
    AllowOverride All
    RewriteEngine On
    RewriteBase /
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^(.+)$ /index.php?url=$1 [QSA,L]
</Directory>
