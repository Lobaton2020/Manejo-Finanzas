apiVersion: apps/v1
kind: Deployment
metadata:
  name: manejo-finanzas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manejo-finanzas
  template:
    metadata:
      labels:
        app: manejo-finanzas
    spec:
      containers:
        - name: php-apache
          image: aflobaton/manejo-finanzas:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: env-file
              mountPath: /var/www/html/.env
              subPath: .env
              readOnly: true
            - name: php-config
              mountPath: /usr/local/etc/php/php.ini
              subPath: php.ini
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: env-file
          secret:
            secretName: manejo-finanzas-secrets
        - name: php-config
          configMap:
            name: php-config
            items:
              - key: php.ini
                path: php.ini